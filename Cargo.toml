[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
governor = { path = "crates/governor" }
orch-team = { path = "crates/orch-team" }
orch-tasks = { path = "crates/orch-tasks" }
orch-secrets = { path = "crates/orch-secrets" }
orch-protocol = { path = "crates/orch-protocol" }
agent-runtime = { path = "crates/agent-runtime" }
orch-store = { path = "crates/orch-store" }
orch-git = { path = "crates/orch-git" }
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
proptest = "1"
anyhow = "1"
libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
