[package]
name = "orch-terminal-spike"
version = "0.0.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
core-text = "22"

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = 3
strip = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
