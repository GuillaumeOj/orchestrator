name: icon-probe
on:
  pull_request:
    paths: [".github/workflows/icon-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe actool variants
        shell: bash
        run: |
          xcodebuild -version; sw_vers; xcrun actool --version | grep -A1 short-bundle
          SRC=crates/orch-app/icons/Orchestrator.icon
          probe() { # name, python snippet
            d=$RUNNER_TEMP/$1; mkdir -p "$d/out"; cp -R "$SRC" "$d/Icon.icon"
            python3 - "$d/Icon.icon/icon.json" "$2" <<'PY'
          import json,sys
          p=sys.argv[1]; j=json.load(open(p)); exec(sys.argv[2]); json.dump(j,open(p,'w'),indent=2)
          PY
            if xcrun actool "$d/Icon.icon" --compile "$d/out" --output-format human-readable-text --notices --warnings --output-partial-info-plist "$d/out/a.plist" --app-icon Icon --include-all-app-icons --accent-color AccentColor --enable-on-demand-resources NO --development-region en --target-device mac --minimum-deployment-target 26.0 --platform macosx >"$d/log" 2>&1 && [ -f "$d/out/Assets.car" ]; then echo "PROBE $1: ok"; else echo "PROBE $1: FAIL"; head -3 "$d/log"; fi
          }
          probe base "pass"
          probe ring_only "j['groups']=j['groups'][:1]"
          probe prompt_only "j['groups']=j['groups'][1:]"
          probe no_fill "j.pop('fill-specializations')"
          probe solid_fill "j.pop('fill-specializations'); j['fill']={'solid':'srgb:0.1,0.1,0.2,1.0'}"
          probe no_platforms "j.pop('supported-platforms')"
          probe no_effects "[g.pop(k,None) for g in j['groups'] for k in ('shadow','translucency')]"
          probe one_layer "j['groups']=[{'layers':[j['groups'][0]['layers'][0]],'name':'G'}]"
