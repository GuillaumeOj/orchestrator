name: CI

on:
  push:
    branches: [main]
  pull_request:
    # The defaults, plus ready_for_review: a draft PR is built once it is ready (job app-pr).
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs only: every commit on main keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-fmt:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install # from rust-toolchain.toml
      - run: make fmt-check

  rust:
    name: Rust lint and test
    # The app is macOS-only (Tauri, kitty, the .app bundle).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install # from rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: git version (tests need >= 2.48)
        run: |
          git --version
          IFS=. read -r major minor _ <<< "$(git --version | awk '{print $3}')"
          if [ "$major" -lt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -lt 48 ]; }; then
            echo "::error::git >= 2.48 required, found $major.$minor"
            exit 1
          fi
      - run: make clippy
      # Every test binary runs (no stop at the first failing one), and each
      # failing test becomes an annotation on the run, with its panic, so
      # it can be read without the job log.
      - name: make rust-test
        run: |
          set -o pipefail
          make rust-test CARGO_TEST_ARGS=--no-fail-fast 2>&1 | tee "$RUNNER_TEMP/rust-test.log"
      - name: Failing tests
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/rust-test.log" ] || exit 0
          python3 .github/scripts/failing-tests.py "$RUNNER_TEMP/rust-test.log"

  ui:
    name: UI lint, type check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ui/package.json
      - run: make ui-deps
      - run: make ui-lint
      - run: make ui-test
      - run: make ui-build

  # Every green commit on main becomes a signed Orchestrator.app release (v0.1.<run_number>)
  # that installed apps pick up by themselves. The logic lives in scripts/app.sh; the steps
  # shared with app-pr in .github/actions/build-app (which takes no secret).
  app:
    name: Build and release the app
    needs: [rust-fmt, rust, ui]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    permissions:
      contents: write
    # Builds publish one at a time. GitHub keeps one pending run per group, so a burst of merges
    # can skip the middle ones; the app updates to the newest anyway.
    concurrency:
      group: app-release
      cancel-in-progress: false
    env:
      ORCH_VERSION: 0.1.${{ github.run_number }}
      ORCH_BUILD_SHA: ${{ github.sha }}
      ORCH_BUILD_CHANNEL: main
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Signing key is set
        env:
          ORCH_UPDATE_KEY: ${{ secrets.ORCH_UPDATE_KEY }}
          ORCH_UPDATE_KEY_PASSWORD: ${{ secrets.ORCH_UPDATE_KEY_PASSWORD }}
        run: |
          if [ -z "$ORCH_UPDATE_KEY" ] || [ -z "$ORCH_UPDATE_KEY_PASSWORD" ]; then
            echo "::error::secrets ORCH_UPDATE_KEY / ORCH_UPDATE_KEY_PASSWORD are not set: nothing is published (see docs/app/RUNNING.md, Updates)"
            exit 1
          fi
      - uses: ./.github/actions/build-app
      # main is merged code: it may hold the key (a PR build never does, see app-pr).
      - name: Pack and sign
        env:
          ORCH_UPDATE_KEY: ${{ secrets.ORCH_UPDATE_KEY }}
          ORCH_UPDATE_KEY_PASSWORD: ${{ secrets.ORCH_UPDATE_KEY_PASSWORD }}
        run: scripts/app.sh package
      - name: Publish release
        run: |
          tag="v$ORCH_VERSION"
          subject=$(git log -1 --format=%s "$GITHUB_SHA")
          asset="target/release/bundle/update/Orchestrator_${ORCH_VERSION}_aarch64.app.tar.gz"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A re-run of this run (same run number): the release exists, replace its assets.
            gh release upload "$tag" "$asset" "$asset.sig" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
              --title "Orchestrator $ORCH_VERSION" \
              --notes "$subject"$'\n\n'"Commit: [$GITHUB_SHA]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)" \
              "$asset" "$asset.sig"
          fi
      - name: Prune old releases (keep the 10 newest)
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^v0\\.1\\.[0-9]+$"))] | sort_by(.createdAt) | reverse | .[10:][].tagName' |
          while read -r old; do
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done

  # Every green push to a same-repo pull request becomes a prerelease pr-<number> that the app
  # can install from Settings > Builds. Fork PRs never get the signing secret; drafts and Renovate
  # PRs are skipped to save macOS minutes (a draft is built when it becomes ready for review).
  # Two jobs, so that PR code never runs next to the signing key or a write token:
  #   app-pr          builds and packs the PR's code (read-only token, no secret), unsigned;
  #   app-pr-publish  signs that tarball with the trusted base tree and publishes the release.
  app-pr:
    name: Build the app for the pull request
    needs: [rust-fmt, rust, ui]
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && github.event.pull_request.user.login != 'renovate[bot]'
    runs-on: macos-latest
    permissions:
      contents: read
    # A newer push supersedes the build in progress (app-pr-publish has the same group).
    concurrency:
      group: app-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      ORCH_VERSION: 0.1.${{ github.run_number }}
      ORCH_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
      ORCH_BUILD_CHANNEL: pr
      ORCH_BUILD_PR: ${{ github.event.pull_request.number }}
    steps:
      # The PR's own commit, not the merge commit the event checks out by default.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/build-app
      - run: scripts/app.sh pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-build
          path: target/release/bundle/update/Orchestrator_${{ env.ORCH_VERSION }}_aarch64.app.tar.gz
          if-no-files-found: error
          retention-days: 1

  app-pr-publish:
    name: Sign and publish the pull request build
    needs: [app-pr]
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && github.event.pull_request.user.login != 'renovate[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # gh pr view (the state check before publishing)
      pull-requests: read
    concurrency:
      group: app-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      ORCH_VERSION: 0.1.${{ github.run_number }}
      ORCH_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
      ORCH_BUILD_PR: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Trusted code: the base branch (main), never the PR. The tarball below is only hashed and
      # signed here, never extracted or run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Signing key is set
        env:
          ORCH_UPDATE_KEY: ${{ secrets.ORCH_UPDATE_KEY }}
          ORCH_UPDATE_KEY_PASSWORD: ${{ secrets.ORCH_UPDATE_KEY_PASSWORD }}
        run: |
          if [ -z "$ORCH_UPDATE_KEY" ] || [ -z "$ORCH_UPDATE_KEY_PASSWORD" ]; then
            echo "::error::secrets ORCH_UPDATE_KEY / ORCH_UPDATE_KEY_PASSWORD are not set: nothing is published (see docs/app/RUNNING.md, Updates)"
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ui/package.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-build
          path: ${{ runner.temp }}/pr-build
      - name: Sign
        env:
          ORCH_UPDATE_KEY: ${{ secrets.ORCH_UPDATE_KEY }}
          ORCH_UPDATE_KEY_PASSWORD: ${{ secrets.ORCH_UPDATE_KEY_PASSWORD }}
        run: |
          tarball="$RUNNER_TEMP/pr-build/Orchestrator_${ORCH_VERSION}_aarch64.app.tar.gz"
          (cd ui && bun install --frozen-lockfile)
          TAURI_SIGNING_PRIVATE_KEY="$ORCH_UPDATE_KEY" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$ORCH_UPDATE_KEY_PASSWORD" \
            sh -c 'cd ui && bun run tauri signer sign "$1"' sh "$tarball"
          [ -s "$tarball.sig" ] || { echo "::error::signing produced no $tarball.sig"; exit 1; }
      - name: Publish prerelease
        env:
          # Untrusted text: read through the environment, never spliced into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          tag="pr-$ORCH_BUILD_PR"
          asset="$RUNNER_TEMP/pr-build/Orchestrator_${ORCH_VERSION}_aarch64.app.tar.gz"
          # The PR may have been closed or merged while this build ran: pr-build-cleanup has
          # already run then, so publishing now would leave a release nothing deletes.
          state=$(gh pr view "$ORCH_BUILD_PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
          if [ "$state" != "OPEN" ]; then
            echo "PR #$ORCH_BUILD_PR is $state: not publishing $tag"
            exit 0
          fi
          # The release is replaced, not updated, so its tag follows the newest built commit.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          # A tag left without a release would keep the old commit as the target.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
          fi
          notes=$(printf '%s\n\nCommit: %s\nVersion: %s\nRun: %s/%s/actions/runs/%s' \
            "$PR_TITLE" "$ORCH_BUILD_SHA" "$ORCH_VERSION" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" --target "$ORCH_BUILD_SHA" --prerelease --latest=false \
            --title "PR #$ORCH_BUILD_PR · $PR_TITLE" \
            --notes "$notes" \
            "$asset" "$asset.sig"
