name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs only: every commit on main keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-fmt:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install # from rust-toolchain.toml
      - run: make fmt-check

  rust:
    name: Rust lint and test
    # The app is macOS-only (Tauri, kitty, the .app bundle).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install # from rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: git version (tests need >= 2.48)
        run: |
          git --version
          IFS=. read -r major minor _ <<< "$(git --version | awk '{print $3}')"
          if [ "$major" -lt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -lt 48 ]; }; then
            echo "::error::git >= 2.48 required, found $major.$minor"
            exit 1
          fi
      - run: make clippy
      - run: make rust-test

  ui:
    name: UI lint, type check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ui/package.json
      - run: make ui-deps
      - run: make ui-lint
      - run: make ui-test
      - run: make ui-build

  # Every green commit on main becomes a signed Orchestrator.app release (v0.1.<run_number>)
  # that installed apps pick up by themselves. The logic lives in scripts/app.sh.
  app:
    name: Build and release the app
    needs: [rust-fmt, rust, ui]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    permissions:
      contents: write
    # Builds publish one at a time; none is dropped (the app updates to the newest).
    concurrency:
      group: app-release
      cancel-in-progress: false
    env:
      ORCH_VERSION: 0.1.${{ github.run_number }}
      ORCH_BUILD_SHA: ${{ github.sha }}
      ORCH_BUILD_CHANNEL: main
      NERD_FONTS_VERSION: v3.4.0
      FIRACODE_SHA256: 7cc4ffd8f7a1fc914cdab7b149808298165ff7a7f40e40d82dea9ebe41e8ca0b
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Signing key is set
        env:
          ORCH_UPDATE_KEY: ${{ secrets.ORCH_UPDATE_KEY }}
          ORCH_UPDATE_KEY_PASSWORD: ${{ secrets.ORCH_UPDATE_KEY_PASSWORD }}
        run: |
          if [ -z "$ORCH_UPDATE_KEY" ] || [ -z "$ORCH_UPDATE_KEY_PASSWORD" ]; then
            echo "::error::secrets ORCH_UPDATE_KEY / ORCH_UPDATE_KEY_PASSWORD are not set: nothing is published (see docs/app/RUNNING.md, Updates)"
            exit 1
          fi
      - run: rustup toolchain install # from rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ui/package.json
      - name: FiraCode Nerd Font
        run: |
          curl -fsSL -o "$RUNNER_TEMP/FiraCode.zip" \
            "https://github.com/ryanoasis/nerd-fonts/releases/download/$NERD_FONTS_VERSION/FiraCode.zip"
          echo "$FIRACODE_SHA256  $RUNNER_TEMP/FiraCode.zip" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/fonts"
          for w in Regular Medium SemiBold Bold; do
            unzip -j -d "$RUNNER_TEMP/fonts" "$RUNNER_TEMP/FiraCode.zip" "FiraCodeNerdFontMono-$w.ttf"
          done
          echo "ORCH_FONT_DIR=$RUNNER_TEMP/fonts" >> "$GITHUB_ENV"
      - run: scripts/app.sh build
      - name: Pack and sign
        env:
          ORCH_UPDATE_KEY: ${{ secrets.ORCH_UPDATE_KEY }}
          ORCH_UPDATE_KEY_PASSWORD: ${{ secrets.ORCH_UPDATE_KEY_PASSWORD }}
        run: scripts/app.sh package
      - name: Publish release
        run: |
          tag="v$ORCH_VERSION"
          subject=$(git log -1 --format=%s "$GITHUB_SHA")
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Orchestrator $ORCH_VERSION" \
            --notes "$subject"$'\n\n'"Commit: [$GITHUB_SHA]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)" \
            "target/release/bundle/update/Orchestrator_${ORCH_VERSION}_aarch64.app.tar.gz" \
            "target/release/bundle/update/Orchestrator_${ORCH_VERSION}_aarch64.app.tar.gz.sig"
      - name: Prune old releases (keep the 10 newest)
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^v0\\.1\\.[0-9]+$"))] | sort_by(.createdAt) | reverse | .[10:][].tagName' |
          while read -r old; do
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
